<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNW Climate Week — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; background: #f5f5f3; color: #1a1a18; padding: 2rem 1rem 4rem; }
    .wrap { max-width: 960px; margin: 0 auto; }
    header { margin-bottom: 2rem; }
    header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    header p { font-size: 13px; color: #9e9e99; }
    .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 2rem; }
    .stat { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 1rem 1.2rem; }
    .stat-label { font-size: 11px; font-weight: 600; color: #9e9e99; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .stat-value { font-size: 26px; font-weight: 600; }
    .stat-unit { font-size: 11px; color: #9e9e99; margin-top: 2px; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .card-title { font-size: 11px; font-weight: 700; color: #9e9e99; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 1rem; }
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { font-size: 13px; color: #6b6b67; width: 130px; flex-shrink: 0; }
    .bar-track { flex: 1; height: 10px; background: #f0f0ee; border-radius: 5px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 5px; }
    .bar-val { font-size: 13px; font-weight: 600; width: 120px; text-align: right; flex-shrink: 0; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 1rem; }
    .table-wrap { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; overflow: auto; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    thead th { background: #f5f5f3; font-size: 11px; font-weight: 700; color: #9e9e99; text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px; text-align: left; border-bottom: 1px solid #e8e8e6; }
    tbody td { padding: 10px 14px; border-bottom: 1px solid #f0f0ee; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafaf8; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; display: inline-block; }
    .b-Exemplary { background: #EAF3DE; color: #3B6D11; }
    .b-Good { background: #EAF3DE; color: #3B6D11; }
    .b-Average { background: #FAEEDA; color: #854F0B; }
    .b-Below { background: #FAECE7; color: #D85A30; }
    .b-Needs { background: #FCEBEB; color: #A32D2D; }
    .btn { background: #1D9E75; color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .btn:hover { background: #0F6E56; }
    .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .loading { color: #9e9e99; padding: 2rem 0; text-align: center; font-size: 14px; }
    .flags { background: #FFF8F8; border: 1px solid #F4C0C0; border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .flags h2 { color: #A32D2D; }
    @media(max-width:640px){ .grid{grid-template-columns:repeat(2,1fr);} table{font-size:12px;} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PNW Climate Week — Internal Dashboard</h1>
    <p id="ts">Loading data from database…</p>
  </header>
  <div id="content"><div class="loading">Fetching data…</div></div>
</div>
<script>
fetch('/api/dashboard-data?key=pnwcw2026')
  .then(function(r){ return r.json(); })
  .then(function(d){ render(d); })
  .catch(function(){ document.getElementById('content').innerHTML='<p style="color:#A32D2D;padding:1rem;">Could not load data. Check server logs.</p>'; });

function n(v,dec){ var x=parseFloat(v); return isNaN(x)?'—':x.toFixed(dec==null?1:dec); }

function badge(r){
  if(!r) return '—';
  var k=r.split(' ')[0];
  return '<span class="badge b-'+k+'">'+r+'</span>';
}

function bar(label,val,max,color,suffix){
  var pct=max>0?Math.round(parseFloat(val)/max*100):0;
  return '<div class="bar-row">'+
    '<span class="bar-label">'+label+'</span>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'+
    '<span class="bar-val">'+n(val,2)+(suffix||'')+'</span>'+
  '</div>';
}

function render(d){
  document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · '+d.summary.event_count+' events in database';

  var s=d.summary;
  var html='';

  html+='<div class="grid">'+
    stat('Events logged',s.event_count,'')+
    stat('Total attendees',parseInt(s.total_attendees).toLocaleString(),'')+
    stat('Total CO2e',n(s.total_co2e_kg,1),'kg')+
    stat('Avg / person',n(s.avg_per_attendee_co2e_kg,2),'kg CO2e')+
  '</div>';

  var cats=[
    {l:'🚲 Travel',v:s.avg_travel,c:'#1D9E75'},
    {l:'⚡ Energy',v:s.avg_energy,c:'#7F77DD'},
    {l:'🥗 Catering',v:s.avg_catering,c:'#639922'},
    {l:'🗑️ Waste',v:s.avg_waste,c:'#BA7517'},
    {l:'📦 Materials',v:s.avg_materials,c:'#D4537E'}
  ];
  var maxC=Math.max.apply(null,cats.map(function(c){return parseFloat(c.v)||0;}))||1;
  html+='<div class="card"><div class="card-title">Average CO2e by category</div>'+
    cats.map(function(c){return bar(c.l,c.v,maxC,c.c,' kg avg');}).join('')+'</div>';

  var cityRows=(d.by_city||[]).map(function(c){
    return '<tr><td>'+( c.city||'—')+'</td><td>'+c.event_count+'</td><td>'+
      parseInt(c.total_attendees).toLocaleString()+'</td><td>'+n(c.avg_per_attendee,2)+' kg</td><td>'+n(c.total_co2e_kg,1)+' kg</td></tr>';
  }).join('')||'<tr><td colspan="5" style="color:#9e9e99;padding:1rem;">No data yet.</td></tr>';
  html+='<div class="card"><div class="card-title">By city</div><div style="overflow:auto;"><table><thead><tr><th>City</th><th>Events</th><th>Attendees</th><th>Avg/person</th><th>Total CO2e</th></tr></thead><tbody>'+cityRows+'</tbody></table></div></div>';

  var RATS=['Exemplary','Good effort','Average','Below average','Needs improvement'];
  var RCOLS={'Exemplary':'#1D9E75','Good effort':'#639922','Average':'#BA7517','Below average':'#D85A30','Needs improvement':'#A32D2D'};
  var rm={};(d.by_rating||[]).forEach(function(r){rm[r.rating]=parseInt(r.count);});
  var maxR=Math.max.apply(null,RATS.map(function(r){return rm[r]||0;}).concat([1]));
  html+='<div class="card"><div class="card-title">Ratings distribution</div>'+
    RATS.map(function(r){return bar(r,rm[r]||0,maxR,RCOLS[r],' events');}).join('')+'</div>';

  var evRows=(d.events||[]).map(function(e){
    return '<tr><td><strong>'+(e.event_name||'—')+'</strong></td>'+
      '<td>'+(e.event_date?e.event_date.slice(0,10):'—')+'</td>'+
      '<td>'+(e.city||'—')+'</td>'+
      '<td>'+(e.total_attendees||'—')+'</td>'+
      '<td>'+n(e.per_attendee_co2e_kg,2)+' kg</td>'+
      '<td>'+n(e.total_co2e_kg,1)+' kg</td>'+
      '<td>'+badge(e.rating)+'</td>'+
      '<td>'+(e.submitter_name||'—')+'</td>'+
    '</tr>';
  }).join('')||'<tr><td colspan="8" style="color:#9e9e99;padding:1rem;">No events yet.</td></tr>';
  html+='<div class="row-between"><h2>All events</h2><button class="btn" onclick="exportCSV()">Export CSV</button></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Event</th><th>Date</th><th>City</th><th>Attendees</th><th>Per person</th><th>Total CO2e</th><th>Rating</th><th>Submitted by</th></tr></thead><tbody>'+evRows+'</tbody></table></div>';

  var flags=(d.events||[]).filter(function(e){return e.rating==='Needs improvement'||e.rating==='Below average';});
  if(flags.length){
    var fr=flags.map(function(e){
      return '<tr><td><strong>'+(e.event_name||'—')+'</strong></td><td>'+(e.city||'—')+'</td><td>'+(e.total_attendees||'—')+'</td><td>'+n(e.per_attendee_co2e_kg,2)+' kg</td><td>'+badge(e.rating)+'</td><td style="color:#6b6b67;white-space:normal;">'+(e.what_to_improve||'—')+'</td></tr>';
    }).join('');
    html+='<div class="flags"><h2 style="margin-bottom:1rem;">⚠️ Needs attention ('+flags.length+')</h2>'+
      '<div style="overflow:auto;"><table><thead><tr><th>Event</th><th>City</th><th>Attendees</th><th>Per person</th><th>Rating</th><th>To improve</th></tr></thead><tbody>'+fr+'</tbody></table></div></div>';
  }

  document.getElementById('content').innerHTML=html;
  window._data=d;
}

function stat(label,value,unit){
  return '<div class="stat"><div class="stat-label">'+label+'</div><div class="stat-value">'+value+'</div>'+(unit?'<div class="stat-unit">'+unit+'</div>':'')+' </div>';
}

function exportCSV(){
  if(!window._data) return;
  var cols=['event_name','event_date','city','organizer','total_attendees','venue_name','per_attendee_co2e_kg','total_co2e_kg','travel_co2_kg','energy_co2_kg','catering_co2_kg','waste_co2_kg','materials_co2_kg','rating','submitter_name','submitter_email','what_worked_well','what_to_improve','created_at'];
  var csv=cols.join(',')+'\n'+window._data.events.map(function(e){
    return cols.map(function(c){return '"'+String(e[c]||'').replace(/"/g,'""')+'"';}).join(',');
  }).join('\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='pnw-events.csv';a.click();
}
</script>
</body>
</html>
